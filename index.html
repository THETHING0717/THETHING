<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE THING | 1688 중국 거래 번역기</title>
  <style>
    :root {
      color-scheme: light;
      --black: #111111;
      --muted: #707070;
      --line: #d9d9d9;
      --soft: #f6f6f6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 760px;
      min-height: 100%;
      margin: 0;
      background: var(--white);
      color: var(--black);
      font-family: Arial, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .site-shell {
      width: min(1200px, calc(100vw - 80px));
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 0 56px;
    }

    .brand-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 28px;
    }

    .wordmark {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1.7px;
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 2px;
      color: #4f4f4f;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .translator {
      width: 100%;
      min-height: 420px;
      overflow: hidden;
      border: 1px solid var(--black);
      background: var(--white);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.07);
    }

    .translator-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
      width: 100%;
      min-height: 420px;
    }

    .translation-pane {
      display: grid;
      grid-template-rows: auto minmax(300px, 1fr) auto;
      min-width: 0;
      min-height: 420px;
      background: var(--white);
    }

    .translation-pane + .translation-pane {
      border-left: 1px solid var(--line);
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
    }

    .language {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.35px;
    }

    .flag {
      font-size: 21px;
      line-height: 1;
    }

    .auto-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .text-area,
    .result-area {
      width: 100%;
      min-height: 300px;
      padding: 28px;
      border: 0;
      outline: 0;
      background: var(--white);
      color: var(--black);
      font-size: 22px;
      line-height: 1.7;
      letter-spacing: -0.25px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .text-area {
      resize: none;
    }

    .text-area::placeholder {
      color: #a0a0a0;
    }

    .result-area:empty::before {
      content: attr(data-placeholder);
      color: #a0a0a0;
    }

    .result-content {
      display: grid;
      align-content: start;
      gap: 14px;
      min-height: 100%;
    }

    .result-kicker {
      margin: 0;
      color: #555555;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .result-primary {
      margin: 0;
      padding: 20px 22px;
      border-left: 4px solid var(--black);
      background: var(--soft);
      color: var(--black);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.65;
    }

    .result-confirmation {
      margin: 0;
      padding: 0 4px;
      color: #3f3f3f;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result-arrow-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      padding: 20px 22px;
      border-left: 4px solid var(--black);
      background: var(--soft);
      font-size: 22px;
      line-height: 1.7;
    }

    .result-source {
      font-weight: 800;
    }

    .result-arrow {
      color: #777777;
      font-weight: 700;
    }

    .result-translation {
      font-weight: 700;
    }

    .pane-actions {
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 10px 18px;
      border-top: 1px solid var(--line);
    }

    .source-actions {
      justify-content: space-between;
    }

    .result-actions {
      justify-content: flex-end;
    }

    .status {
      min-height: 18px;
      margin-left: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .action-button {
      min-width: 92px;
      min-height: 40px;
      padding: 9px 18px;
      border: 1px solid var(--black);
      border-radius: 0;
      background: var(--white);
      color: var(--black);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: background 140ms ease, color 140ms ease;
    }

    .action-button:hover,
    .action-button:focus-visible {
      background: var(--black);
      color: var(--white);
    }

    .action-button:disabled {
      border-color: #bdbdbd;
      color: #a0a0a0;
      cursor: default;
      background: var(--white);
    }

    @media (max-height: 760px) {
      .site-shell {
        padding-top: 28px;
        padding-bottom: 32px;
      }

      .brand-header {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="brand-header">
      <h1 class="wordmark" aria-label="THE THING">THE THING</h1>
      <p class="subtitle">1688 중국 거래 번역기</p>
    </header>

    <section class="translator" aria-label="중국어 한국어 자동 번역기">
      <div class="translator-grid">
        <section class="translation-pane" aria-label="원문 입력">
          <header class="pane-head">
            <div class="language">
              <span class="flag" id="sourceFlag" aria-hidden="true">🇨🇳</span>
              <span id="sourceLanguage">중국어</span>
            </div>
            <span class="auto-label">자동 감지</span>
          </header>

          <textarea id="sourceText" class="text-area" aria-label="번역할 문장 입력" placeholder="중국어 입력" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

          <footer class="pane-actions source-actions">
            <button class="action-button" id="pasteButton" type="button">붙여넣기</button>
            <span class="status" id="status" role="status" aria-live="polite"></span>
          </footer>
        </section>

        <section class="translation-pane" aria-label="번역 결과">
          <header class="pane-head">
            <div class="language">
              <span class="flag" id="targetFlag" aria-hidden="true">🇰🇷</span>
              <span id="targetLanguage">한국어 번역</span>
            </div>
          </header>

          <div id="resultText" class="result-area" role="textbox" aria-label="번역 결과" aria-readonly="true" data-placeholder="중국어 원문과 한국어 번역이 여기에 표시됩니다."></div>

          <footer class="pane-actions result-actions">
            <button class="action-button" id="copyButton" type="button" disabled="">복사</button>
          </footer>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const sourceText = document.getElementById("sourceText");
      const resultText = document.getElementById("resultText");
      const pasteButton = document.getElementById("pasteButton");
      const copyButton = document.getElementById("copyButton");
      const status = document.getElementById("status");
      const sourceFlag = document.getElementById("sourceFlag");
      const sourceLanguage = document.getElementById("sourceLanguage");
      const targetFlag = document.getElementById("targetFlag");
      const targetLanguage = document.getElementById("targetLanguage");

      let debounceTimer = null;
      let requestController = null;
      let requestSequence = 0;
      let currentCopyText = "";

      function detectDirection(text) {
        const hasKorean = /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(text);
        return hasKorean
          ? { source: "ko", target: "zh-CN", sourceName: "한국어", targetName: "중국어 간체", sourceFlag: "🇰🇷", targetFlag: "🇨🇳" }
          : { source: "zh-CN", target: "ko", sourceName: "중국어", targetName: "한국어", sourceFlag: "🇨🇳", targetFlag: "🇰🇷" };
      }

      function updateDirection(direction) {
        sourceFlag.textContent = direction.sourceFlag;
        sourceLanguage.textContent = direction.sourceName;
        targetFlag.textContent = direction.targetFlag;
        targetLanguage.textContent = direction.source === "ko" ? "중국어 간체 + 한국어 확인" : "한국어 번역";
        sourceText.placeholder = direction.source === "ko" ? "한국어 입력" : "중국어 입력";
        resultText.dataset.placeholder = direction.source === "ko"
          ? "중국어 간체와 한국어 확인 번역이 여기에 표시됩니다."
          : "중국어 원문과 한국어 번역이 여기에 표시됩니다.";
      }

      function createResultElement(className, text, tagName = "p") {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function clearResult() {
        resultText.replaceChildren();
        currentCopyText = "";
        copyButton.disabled = true;
        copyButton.textContent = "복사";
      }

      function setResult({ source, translated, confirmation, direction }) {
        const content = document.createElement("div");
        content.className = "result-content";

        if (direction.source === "ko") {
          content.append(
            createResultElement("result-kicker", "중국어로:"),
            createResultElement("result-primary", translated),
            createResultElement("result-confirmation", `= ${confirmation || source}`)
          );
          currentCopyText = translated;
          copyButton.textContent = "중국어 복사";
        } else {
          const row = document.createElement("div");
          row.className = "result-arrow-row";
          row.append(
            createResultElement("result-source", source, "span"),
            createResultElement("result-arrow", "→", "span"),
            createResultElement("result-translation", translated, "span")
          );
          content.append(
            createResultElement("result-kicker", "한국어로:"),
            row
          );
          currentCopyText = translated;
          copyButton.textContent = "한국어 복사";
        }

        resultText.replaceChildren(content);
        copyButton.disabled = false;
      }

      function parseGoogleTranslation(data) {
        if (!Array.isArray(data) || !Array.isArray(data[0])) return "";
        return data[0].map((part) => Array.isArray(part) ? part[0] : "").join("");
      }

      async function translateWithGoogle(text, direction, signal) {
        const params = new URLSearchParams({
          client: "gtx",
          sl: direction.source,
          tl: direction.target,
          dt: "t",
          q: text
        });
        const response = await fetch(`https://translate.googleapis.com/translate_a/single?${params}`, { signal });
        if (!response.ok) throw new Error("Google translation request failed");
        const translated = parseGoogleTranslation(await response.json());
        if (!translated) throw new Error("Empty translation result");
        return translated;
      }

      async function translateWithMyMemory(text, direction, signal) {
        const source = direction.source === "zh-CN" ? "zh-CN" : "ko";
        const target = direction.target === "zh-CN" ? "zh-CN" : "ko";
        const params = new URLSearchParams({ q: text, langpair: `${source}|${target}` });
        const response = await fetch(`https://api.mymemory.translated.net/get?${params}`, { signal });
        if (!response.ok) throw new Error("Fallback translation request failed");
        const data = await response.json();
        const translated = data && data.responseData && data.responseData.translatedText;
        if (!translated) throw new Error("Empty fallback result");
        return translated;
      }

      async function translateNow() {
        clearTimeout(debounceTimer);
        const text = sourceText.value.trim();
        const direction = detectDirection(text);
        updateDirection(direction);

        if (!text) {
          if (requestController) requestController.abort();
          status.textContent = "";
          clearResult();
          return;
        }

        if (requestController) requestController.abort();
        requestController = new AbortController();
        const sequence = ++requestSequence;
        status.textContent = "번역 중…";
        clearResult();

        try {
          let translated;
          try {
            translated = await translateWithGoogle(text, direction, requestController.signal);
          } catch (error) {
            if (error.name === "AbortError") throw error;
            translated = await translateWithMyMemory(text, direction, requestController.signal);
          }
          if (sequence !== requestSequence) return;

          let confirmation = "";
          if (direction.source === "ko") {
            const reverseDirection = {
              source: "zh-CN",
              target: "ko"
            };
            try {
              confirmation = await translateWithGoogle(translated, reverseDirection, requestController.signal);
            } catch (error) {
              if (error.name === "AbortError") throw error;
              try {
                confirmation = await translateWithMyMemory(translated, reverseDirection, requestController.signal);
              } catch (reverseError) {
                if (reverseError.name === "AbortError") throw reverseError;
                confirmation = text;
              }
            }
          }

          if (sequence !== requestSequence) return;
          setResult({ source: text, translated, confirmation, direction });
          status.textContent = "자동 번역 완료";
        } catch (error) {
          if (error.name === "AbortError" || sequence !== requestSequence) return;
          clearResult();
          status.textContent = "인터넷 연결을 확인해 주세요.";
        }
      }

      function scheduleTranslation() {
        const direction = detectDirection(sourceText.value);
        updateDirection(direction);
        status.textContent = sourceText.value.trim() ? "입력 확인 중…" : "";
        debounceTimer = setTimeout(translateNow, 550);
      }

      function resetTranslatorSession() {
        clearTimeout(debounceTimer);
        if (requestController) {
          requestController.abort();
          requestController = null;
        }
        requestSequence += 1;
        sourceText.value = "";
        status.textContent = "";
        updateDirection(detectDirection(""));
        clearResult();
      }

      window.addEventListener("pageshow", resetTranslatorSession);
      resetTranslatorSession();

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        if (!copied) throw new Error("Copy failed");
      }

      sourceText.addEventListener("input", scheduleTranslation);

      sourceText.addEventListener("paste", () => {
        setTimeout(translateNow, 0);
      });

      pasteButton.addEventListener("click", async () => {
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("Clipboard unavailable");
          const text = await navigator.clipboard.readText();
          if (!text) {
            status.textContent = "클립보드가 비어 있습니다.";
            return;
          }
          sourceText.value = text;
          sourceText.focus();
          await translateNow();
        } catch (error) {
          sourceText.focus();
          status.textContent = "입력창을 선택했습니다. Ctrl+V로 붙여넣어 주세요.";
        }
      });

      copyButton.addEventListener("click", async () => {
        const text = currentCopyText;
        if (!text) return;
        try {
          await copyText(text);
          const originalLabel = copyButton.textContent;
          copyButton.textContent = "복사됨";
          setTimeout(() => { copyButton.textContent = originalLabel; }, 1300);
        } catch (error) {
          status.textContent = "복사하지 못했습니다. 결과를 선택해 복사해 주세요.";
        }
      });
    })();
  </script>





</body></html>
